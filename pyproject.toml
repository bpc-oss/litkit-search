[project]
name = "litkit-search"
version = "0.1.0"
description = "Unified academic literature search toolkit — bulk retrieval, citation audit, ranked search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "bpshil", email = "bpshil@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "httpx>=0.27,<1",
    "tenacity>=8,<9",
    "pydantic>=2,<3",
    "typer>=0.15,<1",
    "rich>=13,<14",
    "python-dotenv>=1,<2",
    "orjson>=3,<4",
    "lxml>=5,<6",
    "beautifulsoup4>=4.12,<5",
    "aiofiles>=23,<25",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "respx>=0.21,<1",
    "ruff>=0.4,<1",
    "pre-commit>=3,<4",
    "mypy>=1,<2",
]
browser = [
    "playwright>=1.40,<2",
]
verify = []
mcp = [
    "mcp>=1,<2",
]
docs = [
    "mkdocs>=1,<2",
    "mkdocs-material>=9,<10",
]

[project.urls]
Homepage = "https://github.com/bpshil/litkit-search"
Repository = "https://github.com/bpshil/litkit-search"
Issues = "https://github.com/bpshil/litkit-search/issues"
Documentation = "https://github.com/bpshil/litkit-search/blob/main/README.md"

[project.scripts]
litkit = "litkit.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "Q"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error", "default::ResourceWarning"]
markers = ["e2e: marks tests as end-to-end tests"]

[tool.coverage.run]
source = ["litkit"]
branch = true

[tool.coverage.report]
fail_under = 55

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# Per-module overrides for known-stable code with design-level type issues.
# These modules are functionally correct but have type annotation strictness
# issues (httpx param types, OpenAI/Anthropic client union, socket types, etc.)
# that would require redesign to fix.
[[tool.mypy.overrides]]
module = [
    "litkit.downloaders.supplementary",
    "litkit.downloaders.institutional",
    "litkit.downloaders._dns",
    "litkit.downloaders.chinese_institutional",
    "litkit.workflows.deep_search.strategy",
    "litkit.workflows.deep_search.citation_graph",
    "litkit.workflows.deep_search.queries",
    "litkit.workflows.deep_search.engine",
    "litkit.workflows.bulk_review",
    "litkit.sources.wos",
    "litkit.sources.pubmed",
    "litkit.sources.doaj",
    "litkit.sources.dblp",
    "litkit.sources.core",
    "litkit.sources.base_search",
    "litkit.cli",
    "litkit.core.pipeline",
    "litkit.downloaders.arxiv",
]
ignore_errors = true

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/litkit/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "docs/**",
]
exclude = [
    "_prep/**",
    "tests/**",
    "adapters/**",
    "scripts/**",
    ".github/**",
    ".venv-test/**",
]
