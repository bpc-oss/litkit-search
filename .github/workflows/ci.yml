name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ adapters/mcp/ tests/

      - name: Format check with ruff
        run: ruff format --check src/ adapters/mcp/

      - name: Type check with mypy
        run: mypy src/

      - name: Test with pytest (unit)
        run: pytest tests/ -m "not e2e" -v --tb=short

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  build:
    name: build wheel + smoke install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke install in a clean venv
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install dist/litkit_search-*.whl
          .venv-smoke/bin/litkit --help >/dev/null
          .venv-smoke/bin/litkit sources | grep -q arxiv

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e:
    name: e2e (main only)
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run e2e tests
        run: pytest tests/e2e -m e2e -v --tb=short
